<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gibbkayyy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* Smooth Scrolling */
html {
  scroll-behavior: smooth;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Inter, sans-serif;
  background:#000;
  color:white;
  overflow-x:hidden;
}

/* Hide default cursor on desktop for custom neon cursor experience */
@media (min-width: 768px) {
  body { cursor: none; }
  a, button, .btn, .download, .scroll-top-btn, video, input, .slider { cursor: none !important; }
}

/* Custom Neon Scrollbar */
::-webkit-scrollbar {
  width: 10px;
}
::-webkit-scrollbar-track {
  background: #000;
}
::-webkit-scrollbar-thumb {
  background: rgba(0, 255, 136, 0.3);
  border-radius: 5px;
  border: 2px solid #000;
}
::-webkit-scrollbar-thumb:hover {
  background: #00ff88;
  box-shadow: 0 0 10px #00ff88;
}

/* CUSTOM NEON CURSOR SYSTEM */
.custom-cursor {
  width: 40px;
  height: 40px;
  border: 1px solid #00ff88;
  border-radius: 50%;
  position: fixed;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 10000;
  box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
  transition: width 0.2s, height 0.2s, background-color 0.2s;
  display: none;
}
.custom-cursor-dot {
  width: 6px;
  height: 6px;
  background: #00ff88;
  border-radius: 50%;
  position: fixed;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 10001;
  box-shadow: 0 0 5px #00ff88;
  display: none;
}
@media (min-width: 768px) {
  .custom-cursor, .custom-cursor-dot { display: block; }
}
.custom-cursor.click-effect {
  width: 25px;
  height: 25px;
  background: rgba(0, 255, 136, 0.2);
}

/* LOADER */
.loader {
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation: fadeOut 1.6s ease forwards;
  animation-delay:1.2s;
}

.circle {
  width:70px;
  height:70px;
  border:4px solid rgba(0,255,136,0.2);
  border-top:4px solid #00ff88;
  border-radius:50%;
  animation: spin 1s linear infinite;
  box-shadow:0 0 20px #00ff88;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

@keyframes fadeOut {
  to { opacity:0; visibility:hidden; }
}

/* BG & Matrix Background */
.bg {
  position:fixed;
  inset:0;
  z-index:-1;
}

.bg::before {
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(0,255,136,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.08) 1px, transparent 1px);
  background-size:60px 60px;
  animation: gridMove 14s linear infinite;
}

.bg::after {
  content:"";
  position:absolute;
  inset:0;
  background: radial-gradient(circle at center, rgba(0,255,136,0.12), transparent 60%);
  animation: pulse 6s ease-in-out infinite;
}

@keyframes gridMove {
  from { transform:translate(0,0); }
  to { transform:translate(60px,60px); }
}

@keyframes pulse {
  0%,100% { opacity:0.4; }
  50% { opacity:0.8; }
}

/* HERO */
.hero {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position: relative;
}

.title {
  font-family: "Bebas Neue";
  font-size: 6rem;
  color: #fff;
  text-shadow: 
    0 0 5px #00ff88,
    0 0 10px #00ff88,
    0 0 20px #00ff88,
    0 0 40px #00ff88;
  animation: neonPulse 3s ease-in-out infinite alternate;
}

@keyframes neonPulse {
  0%, 100% {
    text-shadow: 
      0 0 4px #00ff88,
      0 0 10px #00ff88,
      0 0 18px #00ff88,
      0 0 40px #00ff88;
  }
  50% {
    text-shadow: 
      0 0 8px #00ff88,
      0 0 15px #00ff88,
      0 0 30px #00ff88,
      0 0 60px #00ff88;
  }
}

.tagline { opacity:0.8; margin-bottom: 20px; }

.btn {
  display:inline-block;
  margin:10px;
  padding:12px 22px;
  border:1px solid #00ff88;
  color:#00ff88;
  text-decoration:none;
  border-radius:8px;
  transition:0.25s;
}

.btn:hover {
  background:#00ff88;
  color:black;
  box-shadow:0 0 25px #00ff88;
  transform:scale(1.05);
}

/* Animated Scroll Indicator */
.scroll-indicator {
  position: absolute;
  bottom: 30px;
  font-size: 0.8rem;
  letter-spacing: 2px;
  opacity: 0.5;
  animation: bounce 2s infinite;
  color: #00ff88;
}

@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-10px); }
  60% { transform: translateY(-5px); }
}

/* ABOUT */
.about {
  max-width:600px;
  margin:60px auto;
  text-align:center;
  border:1px solid rgba(0,255,136,0.2);
  padding:20px;
  border-radius:12px;
  transition:0.3s;
}

.about:hover {
  box-shadow:0 0 35px rgba(0,255,136,0.4);
  transform:translateY(-5px);
}

/* BEFORE / AFTER SLIDER ELEMENT */
.comparison-container {
  text-align: center;
  max-width: 800px;
  margin: 80px auto;
  padding: 0 20px;
}
.comparison-container h2 {
  font-family: "Bebas Neue";
  font-size: 4rem;
  color: #00ff88;
  margin-bottom: 5px;
}
.slider-wrapper {
  position: relative;
  width: 100%;
  height: 450px;
  overflow: hidden;
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 12px;
}
.slider-wrapper .img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
}
/* Replace linear-gradients below with real assets paths e.g., url('raw.jpg') later */
.background-img {
  background-image: linear-gradient(45deg, #001a0e, #00ff88);
}
.foreground-img {
  background-image: linear-gradient(45deg, #333, #111);
  width: 50% !important;
}
.slider {
  position: absolute;
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 100%;
  background: transparent;
  opacity: 0;
  z-index: 3;
}
.slider-line {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  background: #00ff88;
  z-index: 2;
  box-shadow: 0 0 10px #00ff88;
  pointer-events: none;
}

/* STATS */
.stats {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:25px;
  padding:80px 20px;
}

.stat {
  border:1px solid rgba(0,255,136,0.2);
  padding:20px;
  border-radius:10px;
  min-width:160px;
  text-align:center;
  transition:0.25s;
}

.stat:hover {
  box-shadow:0 0 25px rgba(0,255,136,0.3);
  transform:translateY(-5px);
}

.stat h3 {
  color:#00ff88;
  font-size:2rem;
}

/* EDITS SECTION */
.edits-section {
  text-align:center;
  padding:60px 20px;
  max-width:1200px;
  margin:0 auto;
}

.edits-section h2 {
  font-family:"Bebas Neue";
  font-size:4rem;
  color:#00ff88;
}

.edits-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap:30px;
  margin-top:40px;
}

.edit-card {
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
}

.edit-card:hover {
  box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
  transform: translateY(-5px);
  border-color: #00ff88;
}

.edit-card video {
  width: 100%;
  display: block;
  border-bottom: 1px solid rgba(0, 255, 136, 0.1);
  background: #000;
}

.edit-info {
  padding: 15px;
}

.edit-info h3 {
  font-family: "Bebas Neue", sans-serif;
  font-size: 1.8rem;
  color: #00ff88;
  margin-bottom: 5px;
}

.edit-info p {
  font-size: 0.9rem;
  opacity: 0.7;
}

/* PACKS */
.packs {
  text-align:center;
  padding:100px 20px;
}

.packs h2 {
  font-family:"Bebas Neue";
  font-size:4rem;
  color:#00ff88;
}

.line {
  width:120px;
  height:2px;
  background:#00ff88;
  margin:20px auto;
}

/* PACK BOX */
.pack-box {
  max-width:500px;
  margin:auto;
  padding:40px;
  border:1px solid rgba(0,255,136,0.2);
  border-radius:15px;
  transition: 0.25s, transform 0.25s, box-shadow 0.25s;
  margin-bottom:20px;
}

.pack-box:hover {
  box-shadow:0 0 25px rgba(0,255,136,0.3);
  transform:translateY(-5px);
}

/* DOWNLOAD */
.download {
  display:inline-block;
  margin-top:20px;
  padding:12px 26px;
  border:1px solid #00ff88;
  color:#00ff88;
  text-decoration:none;
  border-radius:8px;
}

.download:hover {
  background:#00ff88;
  color:black;
}

/* COMING STYLE */
.coming {
  opacity:0.5;
  border-style:dashed;
}

/* SCROLL REVEAL ANIMATION CLASSES */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out;
}

.reveal.active {
  opacity: 1;
  transform: translateY(0);
}

/* FOOTER */
footer {
  text-align:center;
  padding:30px;
  opacity:0.6;
}

/* Scroll Top Button Styling */
.scroll-top-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #000;
  border: 1px solid #00ff88;
  color: #00ff88;
  padding: 10px 15px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 0.8rem;
  z-index: 99;
  transition: 0.2s ease;
}

.scroll-top-btn:hover {
  background: #00ff88;
  color: #000;
  box-shadow: 0 0 15px #00ff88;
}
</style>
</head>
